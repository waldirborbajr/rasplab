[package]
name = "rasplab"
version = "0.1.0"
edition = "2024"

[dependencies]
sysinfo = "0.33"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
fork = "0.7"
nix = { version = "0.29", features = ["signal", "process", "fs"] }
signal-hook = "0.3"
